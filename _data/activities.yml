# =============================================================================
#  활동사진 페이지 데이터 (날짜 그룹 → 사진 목록)
# =============================================================================
#  활동사진 페이지(/activities/)는 이 파일을 날짜 그룹 순서대로 읽어서
#  "날짜 제목 + 사진 갤러리" 섹션을 반복해서 만듭니다.
#
#  ▷ 새 날짜 그룹 추가하는 방법
#    1) 사진 파일을 assets/images/activities/ 폴더에 업로드합니다.
#    2) 아래에 새 항목을 추가합니다. date는 원하는 문자열을 그대로 쓰면 되고
#       (달력/날짜선택기 없이 화면에 그대로 표시됩니다), photos에는 방금 올린
#       파일명을 하나씩 적어줍니다.
#    3) 목록 맨 위에 추가하면 페이지 맨 위에, 맨 아래에 추가하면 맨 아래에
#       표시됩니다. (최신순으로 보이게 하려면 맨 위에 추가)
#
#  예시:
#  - date: "26.08.01~03"
#    photos:
#      - "학회_단체사진.jpg"
#      - "발표_이형준.jpg"
# =============================================================================

- date: "26.07.06~11"
  photos:
    - "2026-07-19-곰팡내 술집.jpg"
    - "강인균.jpg"
    - "단체 사진.jpg"
    - "위훈성.jpg"
    - "이형준.jpg"
