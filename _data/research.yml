# ---------------------------------------------------------------------------
- id: gnn
  title_ko: "그래프 신경망 (GNN)"
  title_en: "Graph Neural Networks"
  intro_ko: >-
    그래프 구조 데이터에서 노드 간 직접적 연결을 넘어 삼각형·사면체 같은
    고차 상호작용(higher-order interactions)까지 학습하는 새로운 GNN 프레임워크를
    연구합니다. 학생 연구자들과 함께 다양한 응용 영역으로 확장 중입니다.
  intro_en: >-
    We develop graph neural network frameworks that capture high-order
    interactions (e.g., triangles, tetrahedra) beyond pairwise edges. We also
    extend these methods to diverse application domains with student researchers.
  color_from: "#60a5fa"
  color_to: "#7c3aed"
  acronym: "GNN"
  projects:
    - title_ko: "심플리셜 상호작용 기반 노드 분류"
      title_en: "Simplicial Interactions for Node Classification"
      desc_ko: >-
        그래프의 노드 분류 문제에서 단순한 엣지 연결 외에도 삼각형, 사면체 등
        고차 단체 복합체(simplicial complex) 구조를 학습에 통합하는 새로운 GNN
        프레임워크를 제안합니다. 이를 통해 기존 메시지 전달(MPNN) GNN의 표현력
        한계를 이론적·실험적으로 극복합니다.
      desc_en: >-
        A novel GNN framework that leverages simplicial complex structures
        (triangles, tetrahedra) for node classification, overcoming the
        expressiveness limits of standard message-passing GNNs both theoretically
        and empirically.
      image: ""
      paper: "Node classification in networks via simplicial interactions"
      venue: "IEEE Transactions on Neural Networks and Learning Systems, 2025"

    - title_ko: "최대 클리크 증강을 통한 노드 분류"
      title_en: "Augmented Maximal Clique Selection"
      desc_ko: >-
        심플리셜 상호작용 모델을 확장하여, 그래프 내 최대 클리크(maximal clique)를
        선별·증강하는 알고리즘을 통해 노드 표현 학습의 효율성과 정확도를 동시에
        향상시키는 방법을 제안합니다.
      desc_en: >-
        Extension of simplicial interaction models with an algorithm that
        selectively augments maximal cliques in the graph, simultaneously
        improving the efficiency and accuracy of node representation learning.
      image: ""
      paper: "Node classification via simplicial interaction with augmented maximal clique selection"
      venue: "Neurocomputing, 2025"

    - title_ko: "지구 과학 데이터를 위한 GNN"
      title_en: "GNN for Earth Science Applications"
      desc_ko: >-
        대기·기상·해양 데이터처럼 공간적·시간적으로 복잡한 패턴을 가진 환경
        데이터에 GNN을 적용하여, 강수 추정·이상 기후 탐지 등 지구 과학 문제의
        해결 정확도를 향상시키는 연구를 진행 중입니다.
      desc_en: >-
        Applying GNNs to environmental data with complex spatial and temporal
        patterns — such as atmospheric, weather, and ocean data — to improve
        the accuracy of earth science problems like precipitation estimation
        and extreme weather detection.
      image: ""
      paper: "Ongoing research with Hunsung Wi (MS)"
      venue: "—"

# ---------------------------------------------------------------------------
- id: financial-ai
  title_ko: "금융 AI"
  title_en: "Financial AI"
  intro_ko: >-
    딥러닝과 통계적 모델링을 결합하여 주식 변동성 예측, 암호화폐 가격 예측,
    옵션 가격 결정 등 금융 시계열 문제에 새로운 접근법을 제시합니다.
    GARCH·LSTM·분포 변환 등 전통 계량경제학과 신경망의 시너지를 추구합니다.
  intro_en: >-
    We combine deep learning with statistical modeling to tackle financial
    time-series problems — stock volatility forecasting, cryptocurrency price
    prediction, and option pricing. Our work seeks synergies between classical
    econometrics (GARCH, LSTM) and modern neural networks.
  color_from: "#22c55e"
  color_to: "#0ea5e9"
  acronym: "FIN"
  projects:
    - title_ko: "LSTM 분해 기반 비트코인 가격 예측"
      title_en: "Bitcoin Price Prediction via Centralized LSTM Decomposition"
      desc_ko: >-
        암호화폐 가격 시계열의 비정상성(non-stationarity)을 다루기 위해, 시계열을
        다중 구성요소로 분해한 뒤 각각을 LSTM 네트워크로 학습하고 통합 예측치를
        생성하는 중앙화된 분해 접근법을 제안합니다.
      desc_en: >-
        A centralized decomposition approach that addresses the non-stationarity
        of cryptocurrency time-series by decomposing the signal into multiple
        components, learning each with LSTM networks, and producing an integrated
        prediction.
      image: ""
      paper: "Centralized decomposition approach in LSTM for Bitcoin price prediction"
      venue: "Expert Systems with Applications, 2024"

    - title_ko: "GARCH–LSTM 하이브리드 변동성 모델"
      title_en: "Hybrid GARCH–LSTM for Stock Volatility"
      desc_ko: >-
        고전적 계량경제 모델인 GARCH와 LSTM 신경망을 결합하고, 분포 변형 전략을
        도입하여 주식 시장의 변동성을 더 정확하게 예측합니다. 두 패러다임의
        장점을 모두 활용하는 하이브리드 프레임워크입니다.
      desc_en: >-
        A hybrid framework that combines the classical GARCH model with LSTM
        networks and a distribution manipulation strategy to predict stock
        market volatility more accurately, leveraging the strengths of both
        paradigms.
      image: ""
      paper: "A hybrid prediction model integrating GARCH models with LSTM networks"
      venue: "IEEE Access, 2022 · Computational Economics, 2023"

    - title_ko: "분포 변형 전략을 통한 가격 예측"
      title_en: "Distribution Manipulation Strategy"
      desc_ko: >-
        가격 시계열의 분포가 가지는 비대칭성·꼬리 두께(heavy tail) 특성에 주목하여,
        학습 단계에서 데이터 분포를 능동적으로 변형(stretch)함으로써 예측 정확도를
        끌어올리는 새로운 전략을 제안했습니다.
      desc_en: >-
        Focusing on the asymmetry and heavy-tail properties of price time-series
        distributions, we propose a strategy that actively manipulates (stretches)
        the data distribution during training to boost prediction accuracy.
      image: ""
      paper: "Prediction of Bitcoin price based on manipulating distribution strategy"
      venue: "Applied Soft Computing, 2021"

    - title_ko: "은행 시스템 AI"
      title_en: "AI for Banking Systems"
      desc_ko: >-
        딥러닝을 활용한 은행 거래 분석 및 위험 모델링 등 금융 시스템 전반에 대한
        AI 응용 연구를 진행 중입니다.
      desc_en: >-
        Ongoing research on AI applications across banking systems — including
        transaction analysis and risk modeling — using deep learning.
      image: ""
      paper: "Ongoing research with Jihong Park (PhD)"
      venue: "—"

