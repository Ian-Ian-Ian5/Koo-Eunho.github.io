- id: pinn
  title_ko: "물리 정보 신경망 (PINN)"
  title_en: "Physics-Informed Neural Networks"
  intro_ko: >-
    물리 법칙(미분 방정식 등)을 신경망 학습에 직접 통합하여, 데이터만으로
    학습하기 어려운 복잡한 물리 시스템을 해석 가능하고 신뢰할 수 있는 방식으로
    모델링하는 연구를 진행합니다.
  intro_en: >-
    We integrate physical laws (e.g., differential equations) directly into
    neural network training to model complex physical systems in an
    interpretable and reliable way — particularly when pure data-driven
    learning is insufficient.
  color_from: "#f59e0b"
  color_to: "#ef4444"
  acronym: "PINN"
  projects:
    - title_ko: "불연속 인지 PINN: 비선형 쌍곡형 PDE 해석"
      title_en: "Discontinuity-Aware PINNs for Nonlinear Hyperbolic PDEs"
      desc_ko: >-
        물리 정보 신경망(PINN)을 활용하여 쌍곡형 편미분방정식을 해석합니다.
        특히 충격파(shock)와 같은 불연속 현상을 안정적으로 포착하고, 비선형
        파동 문제에서 정확도와 강건성을 높일 수 있는 학습 기법과 신경망 구조를
        탐구합니다. 충격파와 불연속 해를 보다 효과적으로 다룰 수 있는 PINN
        기반 방법론 개발이 현재 핵심 주제입니다.
      desc_en: >-
        Solving hyperbolic partial differential equations with Physics-Informed
        Neural Networks (PINNs) — with a focus on stably capturing discontinuous
        phenomena such as shocks, and improving accuracy and robustness on
        nonlinear wave problems. Current efforts center on PINN-based
        methodologies that handle shock waves and discontinuous solutions more
        effectively.
      image: ""
      paper: "Learning Discontinuity-Aware PINNs for Nonlinear Hyperbolic PDEs (Ingyun Kang, BS–MS Track)"
      venue: "—"

# ---------------------------------------------------------------------------
- id: ai-applications
  title_ko: "AI 응용 (Methods & Applications)"
  title_en: "AI Methods & Applications"
  intro_ko: >-
    딥러닝 기법을 다양한 실세계 문제에 적용하는 연구를 폭넓게 진행합니다.
    확률 분포 학습, 위성 데이터 기반 강수 추정, 추천 시스템 등 응용 영역과
    방법론 양쪽을 모두 다룹니다.
  intro_en: >-
    We apply deep learning methods to diverse real-world problems, working on
    both the methodological side and applied domains — including probability
    distribution learning, satellite-based precipitation retrieval, and
    recommender systems.
  color_from: "#a855f7"
  color_to: "#ec4899"
  acronym: "APP"
  projects:
    - title_ko: "회귀 모델의 확률 분포 변형"
      title_en: "Stretching Probability Distributions in Regression"
      desc_ko: >-
        신경망 기반 회귀 모델이 일반적으로 정규분포 가정에 갇혀 있는 한계를
        극복하기 위해, 학습 단계에서 출력 분포를 능동적으로 변형(stretching)하는
        경험적 전략을 제시합니다. 꼬리 영역의 예측 정확도 개선에 효과적입니다.
      desc_en: >-
        To overcome the typical Gaussian-assumption limitation of neural-network
        regression models, we propose an empirical strategy that actively
        stretches the output distribution during training — particularly
        effective for improving prediction accuracy in the tails.
      image: "/assets/images/research/stretching-distributions.png"
      paper: "Empirical strategy for stretching probability distribution in neural-network-based regression"
      venue: "Neural Networks, 2021"

    - title_ko: "다중 작업 학습 기반 위성 강수 추정"
      title_en: "Multi-task Learning for Satellite Precipitation Retrieval"
      desc_ko: >-
        수동 마이크로파 위성 관측에서 강수량 추정과 강수/무강수 분류를 동시에
        수행하는 다중 작업 학습(multi-task learning) 모델을 제안합니다. 두 작업
        간 정보 공유를 통해 양쪽 모두의 정확도를 향상시킵니다.
      desc_en: >-
        A multi-task learning model that simultaneously performs precipitation
        amount retrieval and rain/no-rain classification from passive microwave
        satellite observations, leveraging shared representation between the
        two tasks for improved accuracy on both.
      image: "/assets/images/research/precipitation-mtl.png"
      paper: "Multi-task learning for simultaneous retrievals of passive microwave precipitation estimates and rain/no-rain classification"
      venue: "Geophysical Research Letters, 2023"

    - title_ko: "Directed Cycle 기반 암호화폐 자금세탁 탐지"
      title_en: "Directed Cycles for Crypto Illicit Transaction Detection"
      desc_ko: >-
        암호화폐 거래 네트워크에서 믹서·텀블러를 통한 자금 세탁 패턴(A → B
        → C → A 같은 방향성 순환)을 탐지하는 GNN 기반 모델을 연구합니다.
        기존 GNN이 노드 간 1:1 관계만 학습해 다자 순환 구조를 포착하지
        못하는 한계를 극복하기 위해, 방향성 있는 짧은 사이클을 탐지하여 노드
        표현에 반영하는 모델을 제안합니다. 이론적으로는 사이클을 위상수학의
        1차 호몰로지(H₁)에 대응시키고, 방향성 단체 복합체 위에서 동작하는
        GNN으로의 확장을 탐색합니다.
      desc_en: >-
        A GNN-based model for detecting money-laundering patterns —
        directional cyclic transactions (A → B → C → A) often produced by
        mixers and tumblers — in cryptocurrency networks. Standard GNNs that
        learn only pairwise relationships struggle with such multi-party
        cycles, so this work proposes detecting directed short cycles and
        embedding them into node representations. Theoretically, the cycles
        correspond to first homology (H₁) in topology, and we explore
        extensions to GNNs operating on directed simplicial complexes.
      image: ""
      paper: "Learning Directed Cycles for Illicit Transaction Detection in Crypto Networks (Hyungjun Lee, MS)"
      venue: "—"
