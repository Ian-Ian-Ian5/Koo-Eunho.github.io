<!DOCTYPE html>
<html lang="ko" data-lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  {% seo %}
  <meta name="google-site-verification" content="YSIAM3qkJ4N8w8mAItRiIEA3IunTBxt0czzyZ_962WU" />
</head>
<body>
  {% include header.html %}

  <main class="page-content">
    {{ content }}
  </main>

  {% include footer.html %}

  <script src="{{ '/assets/js/lang-toggle.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/scroll-reveal.js' | relative_url }}"></script>
</body>
</html>
