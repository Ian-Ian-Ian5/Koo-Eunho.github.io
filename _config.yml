# ----------------------------- Build settings --------------------------------
markdown: kramdown
highlighter: rouge
permalink: /:title/
timezone: Asia/Seoul

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# ----------------------------- Collections ----------------------------------
# 학생별 개인 페이지를 위한 컬렉션. _members/ 폴더 안의 .md 파일들이 자동으로
# /members/{name}/ 주소의 개별 페이지로 빌드됩니다.
collections:
  members:
    output: true
    permalink: /members/:path/

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: ""
      type: "members"
    values:
      layout: "member"

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
  - .gitignore
