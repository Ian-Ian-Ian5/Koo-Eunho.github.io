# ----------------------------- Basic info ------------------------------------
title: "Koo Lab @ JNU"
short_title: "Koo Lab"
description: >-
  전남대학교 빅데이터융합학과 구은호 교수 연구실 — AI & Data Science (Deep Learning)
url: "https://ian-ian-ian5.github.io"
baseurl: "/Koo-Eunho.github.io"          # 프로젝트 페이지 형태이므로 레포명 prefix 필요

# ----------------------------- Lab metadata ----------------------------------
lab:
  name_ko: "구은호 교수 Lab"
  name_en: "Koo Lab"
  affiliation_ko: "전남대학교 빅데이터융합학과"
  affiliation_en: "Department of Big Data Convergence, Chonnam National University"
  building_ko: "전남대학교 광주캠퍼스 자연과학대학 1호관 213호"          # TODO: 정확한 건물/호수 입력
  building_en: "Gwangju Campus, Chonnam National University"
  email: "kooeunho@jnu.ac.kr"               # TODO: 실제 이메일 확인 후 교체
  research_keywords:
    - "Deep Learning"
    - "GNN"
    - "PINN"
    - "Data Science"

# ----------------------------- Professor -------------------------------------
professor:
  name_ko: "구은호"
  name_en: "Eun-Ho Koo"
  title_ko: "교수"
  title_en: "Professor"
  email: "kooeunho@jnu.ac.kr"
  office_ko: "전남대학교 빅데이터융합학과"   # TODO: 정확한 사무실 입력
  office_en: "Dept. of Big Data Convergence, JNU"
  photo: "/assets/images/professor.jpg"
  cv: "/assets/files/cv.pdf"
  scholar: "https://scholar.google.com/citations?user=13BRvZAAAAAJ&hl=ko"
  github: "https://github.com/"
  bio_ko: >-
    구은호 교수는 전남대학교 빅데이터융합학과 교수로, 딥러닝을 중심으로 한
    인공지능 및 데이터 사이언스 분야의 연구를 수행하고 있습니다.
  bio_en: >-
    Eun-Ho Koo is a Professor in the Department of Big Data Convergence at
    Chonnam National University. His research focuses on Deep Learning,
    Artificial Intelligence, and Data Science.

# ----------------------------- Build settings --------------------------------
markdown: kramdown
highlighter: rouge
permalink: /:title/
timezone: Asia/Seoul

# Jekyll plugins (GitHub Pages whitelist)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# ----------------------------- Collections ----------------------------------
# 학생별 개인 페이지를 위한 컬렉션. _members/ 폴더 안의 .md 파일들이 자동으로
# /members/{name}/ 주소의 개별 페이지로 빌드됩니다.
collections:
  members:
    output: true
    permalink: /members/:path/

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: ""
      type: "members"
    values:
      layout: "member"

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
  - .gitignore
