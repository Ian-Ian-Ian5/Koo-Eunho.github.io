# =============================================================================
#  Jeonnam National University — Prof. Eun-Ho Gu Lab Website
#  Built on Jekyll (al-folio inspired)
# =============================================================================

# ----------------------------- Basic info ------------------------------------
title: "Gu Lab @ JNU"
short_title: "Gu Lab"
description: >-
  전남대학교 빅데이터융합학과 구은호 교수 연구실 — AI & Data Science (Deep Learning)
url: "https://eunhogu-lab.github.io"   # GitHub Pages 배포 시 사용자 URL로 변경
baseurl: ""                              # repo 이름이 도메인이면 비워두기, 아니면 "/repo-name"

# ----------------------------- Lab metadata ----------------------------------
lab:
  name_ko: "구은호 교수 연구실"
  name_en: "Gu Lab"
  affiliation_ko: "전남대학교 빅데이터융합학과"
  affiliation_en: "Department of Big Data Convergence, Chonnam National University"
  building_ko: "전남대학교 광주캠퍼스"          # TODO: 정확한 건물/호수 입력
  building_en: "Gwangju Campus, Chonnam National University"
  email: "eunhogu@jnu.ac.kr"               # TODO: 실제 이메일 확인 후 교체
  research_keywords:
    - "Deep Learning"
    - "Computer Vision"
    - "Natural Language Processing"
    - "Data Science"

# ----------------------------- Professor -------------------------------------
professor:
  name_ko: "구은호"
  name_en: "Eun-Ho Gu"
  title_ko: "교수"
  title_en: "Professor"
  email: "eunhogu@jnu.ac.kr"               # TODO: 실제 이메일 확인 후 교체
  office_ko: "전남대학교 빅데이터융합학과"   # TODO: 정확한 사무실 입력
  office_en: "Dept. of Big Data Convergence, JNU"
  photo: "/assets/images/professor.jpg"
  cv: "/assets/files/cv.pdf"
  scholar: "https://scholar.google.com/"   # TODO: 실제 링크 입력
  github: "https://github.com/"
  bio_ko: >-
    구은호 교수는 전남대학교 빅데이터융합학과 교수로, 딥러닝을 중심으로 한
    인공지능 및 데이터 사이언스 분야의 연구를 수행하고 있습니다.
  bio_en: >-
    Eun-Ho Gu is a Professor in the Department of Big Data Convergence at
    Chonnam National University. His research focuses on Deep Learning,
    Artificial Intelligence, and Data Science.

# ----------------------------- Build settings --------------------------------
markdown: kramdown
highlighter: rouge
permalink: /:title/
timezone: Asia/Seoul

# Jekyll plugins (GitHub Pages whitelist)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: "default"

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
  - .gitignore
