<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-col">
      <h4 data-i18n="footer.contact">Contact</h4>
      <p>
        <span data-i18n="footer.email_label">Email</span>:
        <a href="mailto:{{ site.lab.email }}">{{ site.lab.email }}</a>
      </p>
      <p data-i18n="footer.address">{{ site.lab.building_ko }}</p>
    </div>

    <div class="footer-col">
      <h4 data-i18n="footer.lab">Lab</h4>
      <p data-i18n="footer.lab_name">{{ site.lab.name_ko }}</p>
      <p data-i18n="footer.lab_affil">{{ site.lab.affiliation_ko }}</p>
    </div>

    <div class="footer-col">
      <h4 data-i18n="footer.links">Links</h4>
      <p><a href="https://www.jnu.ac.kr/" target="_blank" rel="noopener">전남대학교</a></p>
      <p><a href="{{ '/research/' | relative_url }}" data-i18n="nav.research">Research</a></p>
    </div>
  </div>
  <div class="footer-bottom">
    <p>© {{ 'now' | date: "%Y" }} {{ site.lab.name_en }}. All rights reserved.</p>
  </div>
</footer>
