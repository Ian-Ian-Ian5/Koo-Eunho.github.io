<a class="member-card" href="{{ include.m.url | relative_url }}">
  <div class="member-avatar">
    {% if include.m.photo and include.m.photo != "" %}
      <img src="{{ include.m.photo | relative_url }}" alt="{{ include.m.name_en }}">
    {% else %}
      {{ include.m.name_en | slice: 0, 1 | upcase }}
    {% endif %}
  </div>
  <p class="member-name" data-ko="{{ include.m.name_ko }}" data-en="{{ include.m.name_en }}">{{ include.m.name_ko }}</p>
</a>
